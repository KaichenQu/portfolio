<svg xmlns="http://www.w3.org/2000/svg" width="720" height="229" viewBox="0 0 720 229" role="img" xml:lang="en">
  <title>The protected filename matched both quoted task prose and a metadata-only worktree walk, and each operation was denied.</title>
  <rect width="720" height="229" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">Filename guard matches</tspan></text>
  <rect x="28" y="62" width="664" height="38" rx="0" fill="#F4F7FA" stroke="none" stroke-width="1"/>
  <text class="small strong" text-anchor="start" data-bounds="36 64 230 98"><tspan x="40" y="85">Operation</tspan></text>
  <text class="small strong" text-anchor="start" data-bounds="247 64 463 98"><tspan x="251" y="85">Input seen by guard</tspan></text>
  <text class="small strong" text-anchor="start" data-bounds="480 64 683 98"><tspan x="484" y="85">Observed result</tspan></text>
  <path d="M239 62L239 203" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M472 62L472 203" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M28 100L692 100" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text text-anchor="start" data-bounds="36 102 230 139"><tspan x="40" y="123">Task specification</tspan></text>
  <text class="mono" text-anchor="start" data-bounds="247 102 463 139"><tspan x="251" y="123">.env.example</tspan></text>
  <text text-anchor="start" data-bounds="480 102 683 139"><tspan x="484" y="123">Quoted prose denied</tspan></text>
  <path d="M28 141L692 141" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="mono" text-anchor="start" data-bounds="36 143 230 201"><tspan x="40" y="164">lint-staged</tspan></text>
  <text class="mono" text-anchor="start" data-bounds="247 143 463 201"><tspan x="251" y="164">lstat()</tspan><tspan x="251" y="185">.env.example</tspan></text>
  <text text-anchor="start" data-bounds="480 143 683 201"><tspan x="484" y="164">Backup aborted</tspan></text>
  <path d="M28 203L692 203" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
