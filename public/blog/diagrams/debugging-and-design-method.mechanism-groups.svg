<svg xmlns="http://www.w3.org/2000/svg" width="720" height="299" viewBox="0 0 720 299" role="img" xml:lang="en">
  <title>Debugging narrows the suspect range, verification compares the same evidence, and design puts rules at the boundaries that own them.</title>
  <rect width="720" height="299" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">Debug and design evidence</tspan></text>
  <rect x="28" y="62" width="183" height="43" rx="0" fill="#F4F7FA" stroke="none" stroke-width="1"/>
  <path d="M28 62L692 62" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" text-anchor="start" data-bounds="37 65 205 102"><tspan x="42" y="86">Localize</tspan></text>
  <text text-anchor="start" data-bounds="224 65 692 102"><tspan x="229" y="86">Bisect the repeatable failure range</tspan></text>
  <rect x="28" y="105" width="183" height="43" rx="0" fill="#F4F7FA" stroke="none" stroke-width="1"/>
  <path d="M28 105L692 105" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" text-anchor="start" data-bounds="37 108 205 145"><tspan x="42" y="129">Compare</tspan></text>
  <text text-anchor="start" data-bounds="224 108 692 145"><tspan x="229" y="129">Reuse the same repro or baseline failure list</tspan></text>
  <rect x="28" y="148" width="183" height="43" rx="0" fill="#F4F7FA" stroke="none" stroke-width="1"/>
  <path d="M28 148L692 148" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" text-anchor="start" data-bounds="37 151 205 188"><tspan x="42" y="172">Observe</tspan></text>
  <text text-anchor="start" data-bounds="224 151 692 188"><tspan x="229" y="172">Log the values crossing a boundary</tspan></text>
  <rect x="28" y="191" width="183" height="43" rx="0" fill="#F4F7FA" stroke="none" stroke-width="1"/>
  <path d="M28 191L692 191" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" text-anchor="start" data-bounds="37 194 205 231"><tspan x="42" y="215">Place the rule</tspan></text>
  <text text-anchor="start" data-bounds="224 194 692 231"><tspan x="229" y="215">Group modules by reasons to change</tspan></text>
  <rect x="28" y="234" width="183" height="43" rx="0" fill="#F4F7FA" stroke="none" stroke-width="1"/>
  <path d="M28 234L692 234" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" text-anchor="start" data-bounds="37 237 205 274"><tspan x="42" y="258">Recover</tspan></text>
  <text text-anchor="start" data-bounds="224 237 692 274"><tspan x="229" y="258">Persist IDs before the next dependent request</tspan></text>
  <path d="M28 277L692 277" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M211 62L211 277" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
