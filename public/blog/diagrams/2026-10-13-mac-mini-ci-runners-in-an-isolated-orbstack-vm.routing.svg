<svg xmlns="http://www.w3.org/2000/svg" width="720" height="286" viewBox="0 0 720 286" role="img" xml:lang="en">
  <title>The CI workflow sends heavy jobs to the VM only while the runner heartbeat is younger than 5 minutes and the labels are set.</title>
  <rect width="720" height="286" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <defs>
    <marker id="arrow-muted" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#52616F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">CI heartbeat routing</tspan></text>
  <text class="mono strong" text-anchor="start" data-bounds="22 53 698 274"><tspan x="28" y="76">ci-heartbeat</tspan></text>
  <text class="mono focus" text-anchor="start" data-bounds="22 53 698 274"><tspan x="155" y="76">PATCH CI_RUNNER_HEARTBEAT</tspan></text>
  <text class="small muted" text-anchor="start" data-bounds="22 53 698 274"><tspan x="28" y="105">Updates every minute while a runner is active</tspan></text>
  <path d="M58 165L678 165" fill="none" stroke="#52616F" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <path d="M58 158L58 171" fill="none" stroke="#52616F" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M151 158L151 171" fill="none" stroke="#52616F" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M244 158L244 171" fill="none" stroke="#52616F" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M337 158L337 171" fill="none" stroke="#52616F" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M430 158L430 171" fill="none" stroke="#52616F" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M523 158L523 171" fill="none" stroke="#52616F" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="58" cy="165" r="5" fill="#2159A6" stroke="none" stroke-width="1.5"/>
  <path d="M523 127L523 245" fill="none" stroke="#A13834" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
  <text class="small" text-anchor="start" data-bounds="22 53 698 274"><tspan x="58" y="145">Last heartbeat</tspan></text>
  <text class="small fail strong" text-anchor="middle" data-bounds="22 53 698 274"><tspan x="523" y="117">5 min</tspan></text>
  <rect x="58" y="190" width="456" height="42" rx="3" fill="#F4F7FA" stroke="#C5CDD5" stroke-width="1"/>
  <rect x="533" y="190" width="150" height="42" rx="3" fill="#F4F7FA" stroke="#C5CDD5" stroke-width="1"/>
  <text class="strong focus" text-anchor="start" data-bounds="63 192 511 231"><tspan x="72" y="216">Mac mini if both labels are set</tspan></text>
  <text class="strong" text-anchor="start" data-bounds="536 192 676 231"><tspan x="548" y="216">Ubicloud</tspan></text>
  <text class="small muted" text-anchor="start" data-bounds="22 53 698 274"><tspan x="72" y="257">Unset labels also route to Ubicloud</tspan></text>
</svg>
