<svg xmlns="http://www.w3.org/2000/svg" width="720" height="223" viewBox="0 0 720 223" role="img" xml:lang="en">
  <title>A working release and a broken release bound the search, and git bisect identifies the first commit that changed the behavior.</title>
  <rect width="720" height="223" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <defs>
    <marker id="arrow-muted" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#52616F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">First bad commit</tspan></text>
  <path d="M69 137L653 137" fill="none" stroke="#52616F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <circle cx="81" cy="137" r="5" fill="#246849" stroke="#246849" stroke-width="1.5"/>
  <circle cx="203" cy="137" r="5" fill="#FFFFFF" stroke="#52616F" stroke-width="1.5"/>
  <circle cx="345" cy="137" r="5" fill="#A13834" stroke="#A13834" stroke-width="1.5"/>
  <circle cx="474" cy="137" r="5" fill="#FFFFFF" stroke="#52616F" stroke-width="1.5"/>
  <circle cx="610" cy="137" r="5" fill="#A13834" stroke="#A13834" stroke-width="1.5"/>
  <text class="small pass" text-anchor="start" data-bounds="22 53 698 211"><tspan x="81" y="108">Last release works</tspan></text>
  <text class="small fail" text-anchor="end" data-bounds="22 53 698 211"><tspan x="610" y="108">Current release fails</tspan></text>
  <path d="M345 146L345 170" fill="none" stroke="#A13834" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label fail" text-anchor="middle" data-bounds="22 53 698 211"><tspan x="345" y="191">First bad commit</tspan></text>
</svg>
