<svg xmlns="http://www.w3.org/2000/svg" width="720" height="318" viewBox="0 0 720 318" role="img" xml:lang="en">
  <title>All 40 worker threads wait for 15 checked-out connections, and the teardowns that would release them are waiting for worker threads.</title>
  <rect width="720" height="318" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <defs>
    <marker id="arrow-muted" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#52616F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">Worker and connection deadlock</tspan></text>
  <circle cx="48" cy="119" r="5" fill="#2159A6" stroke="#2159A6" stroke-width="1.5"/>
  <text class="label" text-anchor="start" data-bounds="22 53 698 306"><tspan x="48" y="100">40 workers wait</tspan></text>
  <circle cx="672" cy="119" r="5" fill="#FFFFFF" stroke="#2159A6" stroke-width="1.5"/>
  <text class="label" text-anchor="end" data-bounds="22 53 698 306"><tspan x="672" y="100">15 connections checked out</tspan></text>
  <circle cx="672" cy="252" r="5" fill="#FFFFFF" stroke="#2159A6" stroke-width="1.5"/>
  <text class="label" text-anchor="end" data-bounds="22 53 698 306"><tspan x="672" y="279">Routes have finished</tspan></text>
  <circle cx="48" cy="252" r="5" fill="#FFFFFF" stroke="#2159A6" stroke-width="1.5"/>
  <text class="label" text-anchor="start" data-bounds="22 53 698 306"><tspan x="48" y="279">Teardowns queue for workers</tspan></text>
  <path d="M54 119H663" fill="none" stroke="#52616F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <path d="M672 125V243" fill="none" stroke="#52616F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <path d="M666 252H57" fill="none" stroke="#52616F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <path d="M48 246V128" fill="none" stroke="#52616F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <text class="small muted" text-anchor="middle" data-bounds="22 53 698 306"><tspan x="360" y="143">Need a connection</tspan></text>
  <text class="small muted" text-anchor="end" data-bounds="22 53 698 306"><tspan x="654" y="190">Held by completed routes</tspan></text>
  <text class="small muted" text-anchor="middle" data-bounds="22 53 698 306"><tspan x="360" y="238">Release happens in teardown</tspan></text>
  <text class="small muted" text-anchor="start" data-bounds="22 53 698 306"><tspan x="66" y="190">Need a worker thread</tspan></text>
</svg>
