<svg xmlns="http://www.w3.org/2000/svg" width="720" height="328" viewBox="0 0 720 328" role="img" xml:lang="en">
  <title>The shared sparkline store uses a batched request budget, while a separate job merges daily prices into a long-lived Redis store.</title>
  <rect width="720" height="328" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <defs>
    <marker id="arrow-focus" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#2159A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#52616F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">Yahoo request budget</tspan></text>
  <path d="M28 127L205 127" fill="none" stroke="#2159A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-focus)"/>
  <path d="M210 127L433 127" fill="none" stroke="#2159A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-focus)"/>
  <path d="M440 127L681 127" fill="none" stroke="#2159A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-focus)"/>
  <path d="M205 251L28 251" fill="none" stroke="#52616F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <path d="M433 251L210 251" fill="none" stroke="#52616F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <path d="M681 251L440 251" fill="none" stroke="#52616F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <text class="label" text-anchor="start" data-bounds="22 53 698 316"><tspan x="28" y="108">Shared browser store</tspan></text>
  <text class="label" text-anchor="start" data-bounds="22 53 698 316"><tspan x="219" y="108">API and slot cache</tspan></text>
  <text class="label" text-anchor="start" data-bounds="22 53 698 316"><tspan x="451" y="108">Yahoo batches</tspan></text>
  <text class="small" text-anchor="start" data-bounds="22 53 698 316"><tspan x="28" y="152">/api/spark every 150 s</tspan></text>
  <text class="small" text-anchor="start" data-bounds="22 53 698 316"><tspan x="219" y="152">Stop slot on HTTP 429</tspan></text>
  <text class="small" text-anchor="start" data-bounds="22 53 698 316"><tspan x="451" y="152">20 symbols per batch</tspan></text>
  <text class="small" text-anchor="start" data-bounds="22 53 698 316"><tspan x="451" y="176">Up to 3 requests per slot</tspan></text>
  <text class="small focus strong" text-anchor="start" data-bounds="22 53 698 316"><tspan x="451" y="199">≈1,250 per weekday</tspan></text>
  <text class="label" text-anchor="start" data-bounds="22 53 698 316"><tspan x="28" y="232">Daily-bar API</tspan></text>
  <text class="label" text-anchor="start" data-bounds="22 53 698 316"><tspan x="219" y="232">Redis daily bars</tspan></text>
  <text class="label" text-anchor="start" data-bounds="22 53 698 316"><tspan x="451" y="232">Yahoo daily-bar job</tspan></text>
  <text class="small" text-anchor="start" data-bounds="22 53 698 316"><tspan x="28" y="277">Reads cached bars</tspan></text>
  <text class="small" text-anchor="start" data-bounds="22 53 698 316"><tspan x="219" y="277">Merge by date</tspan></text>
  <text class="small" text-anchor="start" data-bounds="22 53 698 316"><tspan x="451" y="277">180 symbols each weekday</tspan></text>
  <text class="small muted" text-anchor="start" data-bounds="22 53 698 316"><tspan x="219" y="300">400-day TTL</tspan></text>
</svg>
