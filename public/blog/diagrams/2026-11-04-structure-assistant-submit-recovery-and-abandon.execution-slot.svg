<svg xmlns="http://www.w3.org/2000/svg" width="720" height="282" viewBox="0 0 720 282" role="img" xml:lang="en">
  <title>The first card occupied the only unfinished execution slot, so the second got TASK_EXECUTION_BUSY and the batch waited for manual recovery.</title>
  <rect width="720" height="282" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">Single execution slot</tspan></text>
  <text class="label" text-anchor="start" data-bounds="22 53 698 270"><tspan x="28" y="88">Task execution slot</tspan></text>
  <rect x="205" y="66" width="291" height="35" rx="3" fill="#F4F7FA" stroke="#2159A6" stroke-width="1"/>
  <text class="focus strong" text-anchor="start" data-bounds="211 68 487 99"><tspan x="219" y="89">Card 1 accepted</tspan></text>
  <path d="M496 71L496 230" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
  <text class="small pass" text-anchor="start" data-bounds="22 53 698 270"><tspan x="507" y="89">Run ends</tspan></text>
  <text class="label" text-anchor="start" data-bounds="22 53 698 270"><tspan x="28" y="154">Card 2 submits</tspan></text>
  <path d="M205 155L686 155" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M264 150l10 10m0 -10l-10 10" fill="none" stroke="#A13834" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="mono fail strong" text-anchor="start" data-bounds="22 53 698 270"><tspan x="283" y="144">409 TASK_EXECUTION_BUSY</tspan></text>
  <text class="small fail" text-anchor="start" data-bounds="22 53 698 270"><tspan x="283" y="183">Batch paused</tspan></text>
  <circle cx="554" cy="155" r="4" fill="#246849" stroke="none" stroke-width="1.5"/>
  <text class="small pass" text-anchor="start" data-bounds="22 53 698 270"><tspan x="566" y="183">Manual recovery</tspan></text>
  <text class="small muted" text-anchor="start" data-bounds="22 53 698 270"><tspan x="28" y="242">Later cards wait for the preceding run and manual recovery</tspan></text>
</svg>
