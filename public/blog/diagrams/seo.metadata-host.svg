<svg xmlns="http://www.w3.org/2000/svg" width="720" height="264" viewBox="0 0 720 264" role="img" xml:lang="en">
  <title>The note’s SEO change adds per-route metadata, a generated Open Graph image and a sitemap, all depending on the configured host.</title>
  <rect width="720" height="264" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <defs>
    <marker id="arrow-focus" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#2159A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">Blog page search metadata</tspan></text>
  <rect x="28" y="66" width="319" height="170" rx="3" fill="#EDF2F6" stroke="#C5CDD5" stroke-width="1"/>
  <text class="label" text-anchor="start" data-bounds="22 53 698 252"><tspan x="43" y="92">One blog route</tspan></text>
  <text class="mono small" text-anchor="start" data-bounds="22 53 698 252"><tspan x="43" y="123">&lt;title&gt;</tspan></text>
  <text class="mono small" text-anchor="start" data-bounds="22 53 698 252"><tspan x="43" y="153">Canonical link</tspan></text>
  <text class="mono small" text-anchor="start" data-bounds="22 53 698 252"><tspan x="43" y="183">Open Graph image</tspan></text>
  <path d="M43 198L332 198" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="small" text-anchor="start" data-bounds="22 53 698 252"><tspan x="43" y="221">Sitemap covers every note</tspan></text>
  <path d="M347 153H443" fill="none" stroke="#2159A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-focus)"/>
  <text class="label focus" text-anchor="start" data-bounds="22 53 698 252"><tspan x="460" y="148">Configured host</tspan></text>
  <text class="small" text-anchor="start" data-bounds="22 53 698 252"><tspan x="460" y="178">Basis for absolute URLs</tspan></text>
</svg>
