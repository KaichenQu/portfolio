<svg xmlns="http://www.w3.org/2000/svg" width="720" height="265" viewBox="0 0 720 265" role="img" xml:lang="en">
  <title>Two branch worktrees share the repository database, and separate CLAUDE_CONFIG_DIR values keep each Claude session’s login and settings isolated.</title>
  <rect width="720" height="265" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">Worktree session isolation</tspan></text>
  <rect x="28" y="65" width="320" height="129" rx="3" fill="#F4F7FA" stroke="#C5CDD5" stroke-width="1"/>
  <text class="label" text-anchor="start" data-bounds="22 53 698 253"><tspan x="42" y="92">First session</tspan></text>
  <text text-anchor="start" data-bounds="22 53 698 253"><tspan x="42" y="123">First branch checkout</tspan></text>
  <text class="mono small focus" text-anchor="start" data-bounds="22 53 698 253"><tspan x="42" y="153">Own CLAUDE_CONFIG_DIR</tspan></text>
  <path d="M188 194V216" fill="none" stroke="#C5CDD5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="372" y="65" width="320" height="129" rx="3" fill="#F4F7FA" stroke="#C5CDD5" stroke-width="1"/>
  <text class="label" text-anchor="start" data-bounds="22 53 698 253"><tspan x="386" y="92">Second session</tspan></text>
  <text text-anchor="start" data-bounds="22 53 698 253"><tspan x="386" y="123">Second branch checkout</tspan></text>
  <text class="mono small focus" text-anchor="start" data-bounds="22 53 698 253"><tspan x="386" y="153">Own CLAUDE_CONFIG_DIR</tspan></text>
  <path d="M532 194V216" fill="none" stroke="#C5CDD5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="142" y="216" width="436" height="23" rx="2" fill="#EDF2F6" stroke="#C5CDD5" stroke-width="1"/>
  <text class="small strong" text-anchor="middle" data-bounds="151 217 569 239"><tspan x="360" y="233">Shared .git database</tspan></text>
</svg>
