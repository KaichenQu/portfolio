<svg xmlns="http://www.w3.org/2000/svg" width="720" height="253" viewBox="0 0 720 253" role="img" xml:lang="en">
  <title>Claude reads mcpServers from the active account’s .claude.json, so a valid entry in a guessed .mcp.json may never load.</title>
  <rect width="720" height="253" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <defs>
    <marker id="arrow-focus" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#2159A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">Claude MCP config location</tspan></text>
  <text class="label" text-anchor="start" data-bounds="26 59 340 92"><tspan x="29" y="82">Guessed location</tspan></text>
  <path d="M38 94L38 113" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M38 113L53 113" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="mono fail" text-anchor="start" data-bounds="55 97 340 127"><tspan x="59" y="117">$HOME/.claude/.mcp.json</tspan></text>
  <text class="label" text-anchor="start" data-bounds="373 59 690 92"><tspan x="376" y="82">Active CLAUDE_CONFIG_DIR</tspan></text>
  <path d="M385 94L385 113" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M385 113L400 113" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="mono focus" text-anchor="start" data-bounds="402 97 690 127"><tspan x="406" y="117">.claude.json</tspan></text>
  <path d="M412 123V143H428" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="mono focus" text-anchor="start" data-bounds="22 53 698 241"><tspan x="434" y="148">mcpServers</tspan></text>
  <path d="M56 144l10 10m0 -10l-10 10" fill="none" stroke="#A13834" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="small fail" text-anchor="start" data-bounds="22 53 698 241"><tspan x="77" y="154">Entry never loaded</tspan></text>
  <path d="M434 163L434 190" fill="none" stroke="#2159A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-focus)"/>
  <text class="small focus" text-anchor="start" data-bounds="22 53 698 241"><tspan x="449" y="208">Verify in the tool list</tspan></text>
</svg>
