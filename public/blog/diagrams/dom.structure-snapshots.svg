<svg xmlns="http://www.w3.org/2000/svg" width="720" height="243" viewBox="0 0 720 243" role="img" xml:lang="en">
  <title>Comparing 60 DOM snapshots alongside 60 screenshots lets the cleanup review compare browser structure as well as pixels.</title>
  <rect width="720" height="243" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">DOM and screenshot evidence</tspan></text>
  <text class="label" text-anchor="start" data-bounds="22 53 698 231"><tspan x="28" y="84">30 screens at two widths</tspan></text>
  <rect x="28" y="112" width="316" height="101" rx="3" fill="#F4F7FA" stroke="#C5CDD5" stroke-width="1"/>
  <rect x="44" y="135" width="46" height="51" rx="3" fill="#FFFFFF" stroke="#2159A6" stroke-width="1"/>
  <text class="label focus" text-anchor="start" data-bounds="22 53 698 231"><tspan x="106" y="147">60 PNGs</tspan></text>
  <text class="small" text-anchor="start" data-bounds="22 53 698 231"><tspan x="106" y="176">Compare pixels</tspan></text>
  <rect x="376" y="112" width="316" height="101" rx="3" fill="#F4F7FA" stroke="#C5CDD5" stroke-width="1"/>
  <rect x="392" y="135" width="46" height="51" rx="3" fill="#FFFFFF" stroke="#2159A6" stroke-width="1"/>
  <text class="label focus" text-anchor="start" data-bounds="22 53 698 231"><tspan x="454" y="147">60 DOM snapshots</tspan></text>
  <text class="small" text-anchor="start" data-bounds="22 53 698 231"><tspan x="454" y="176">Compare elements and attributes</tspan></text>
  <path d="M49 176l10-13 8 6 9-12 9 19Z" fill="none" stroke="#2159A6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M407 147l-7 8 7 8 M423 147l7 8-7 8 M418 145l-6 20" fill="none" stroke="#2159A6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
