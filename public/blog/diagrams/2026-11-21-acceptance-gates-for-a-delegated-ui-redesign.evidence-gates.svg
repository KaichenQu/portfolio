<svg xmlns="http://www.w3.org/2000/svg" width="720" height="249" viewBox="0 0 720 249" role="img" xml:lang="en">
  <title>The controller opened screenshots, ran the full Linux tier and compared vendored hashes, finding five visual defects and two platform-specific test failures.</title>
