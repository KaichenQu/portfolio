  <text class="small strong" text-anchor="start" data-bounds="463 64 683 98"><tspan x="467" y="85">What it found</tspan></text>
  <path d="M228 62L228 223" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M455 62L455 223" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M28 100L692 100" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text text-anchor="start" data-bounds="36 102 219 139"><tspan x="40" y="123">Screenshot review</tspan></text>
  <text text-anchor="start" data-bounds="236 102 446 139"><tspan x="240" y="123">Nine after files opened</tspan></text>
