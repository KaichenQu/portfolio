<svg xmlns="http://www.w3.org/2000/svg" width="720" height="305" viewBox="0 0 720 305" role="img" xml:lang="en">
  <title>A and B run concurrently on two permits, and C starts after a permit frees with one run counted ahead.</title>
  <rect width="720" height="305" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <defs>
    <marker id="arrow-muted" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#52616F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">Two-permit run queue</tspan></text>
  <text class="label" text-anchor="start" data-bounds="22 53 698 293"><tspan x="28" y="120">Permit 1</tspan></text>
  <path d="M143 116L671 116" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" text-anchor="start" data-bounds="22 53 698 293"><tspan x="28" y="174">Permit 2</tspan></text>
  <path d="M143 170L671 170" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" text-anchor="start" data-bounds="22 53 698 293"><tspan x="28" y="228">Queue</tspan></text>
  <path d="M143 224L671 224" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="143.0" y="103" width="271.29" height="26" rx="3" fill="#F4F7FA" stroke="#2159A6" stroke-width="1"/>
  <text class="mono strong" text-anchor="start" data-bounds="22 53 698 293"><tspan x="153.0" y="121">A  103.9 s</tspan></text>
  <rect x="143.17" y="157" width="271.55000000000007" height="26" rx="3" fill="#F4F7FA" stroke="#2159A6" stroke-width="1"/>
  <text class="mono strong" text-anchor="start" data-bounds="22 53 698 293"><tspan x="153.17" y="175">B  104.0 s</tspan></text>
  <rect x="415.64" y="157" width="255.36" height="26" rx="3" fill="#F4F7FA" stroke="#2159A6" stroke-width="1"/>
  <text class="mono strong" text-anchor="start" data-bounds="22 53 698 293"><tspan x="425.64" y="175">C  97.8 s</tspan></text>
  <path d="M143 247L671 247" fill="none" stroke="#52616F" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <path d="M415.64 90L415.64 247" fill="none" stroke="#52616F" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
  <text class="small muted" text-anchor="end" data-bounds="22 53 698 293"><tspan x="406.64" y="85">Permit frees around 104 s</tspan></text>
  <text class="small focus" text-anchor="start" data-bounds="22 53 698 293"><tspan x="155" y="212">C reports runsAhead=1 while queued</tspan></text>
  <text class="small mono" text-anchor="start" data-bounds="22 53 698 293"><tspan x="143" y="272">0 s</tspan></text>
  <text class="small muted" text-anchor="end" data-bounds="22 53 698 293"><tspan x="671" y="272">Time</tspan></text>
</svg>
