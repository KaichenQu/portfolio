<svg xmlns="http://www.w3.org/2000/svg" width="720" height="706" viewBox="0 0 720 706" role="img" xml:lang="zh-CN">
  <title>面板先持久化刚返回的标识，再发送依赖该标识的下一条请求。</title>
  <rect width="720" height="706" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <defs>
    <marker id="arrow-focus" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#2159A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#52616F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">提交身份写入</tspan></text>
  <path d="M100 103L100 678" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
  <text class="label" text-anchor="middle" data-bounds="26 55 196 102"><tspan x="100" y="83">sessionStorage</tspan></text>
  <path d="M360 103L360 678" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
  <text class="label" text-anchor="middle" data-bounds="264 55 456 102"><tspan x="360" y="83">面板</tspan></text>
  <path d="M620 103L620 678" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
  <text class="label" text-anchor="middle" data-bounds="524 55 695 102"><tspan x="620" y="83">服务端</tspan></text>
  <path d="M357 132L103 132" fill="none" stroke="#2159A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-focus)"/>
  <text class="small focus" text-anchor="middle" data-bounds="22 53 698 694"><tspan x="231.5" y="122">冻结标题、草稿及 createId</tspan></text>
  <path d="M363 189L617 189" fill="none" stroke="#52616F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <text class="small muted" text-anchor="middle" data-bounds="22 53 698 694"><tspan x="488.5" y="179">POST /works 携带 createId</tspan></text>
  <path d="M617 246L363 246" fill="none" stroke="#52616F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#arrow-muted)"/>
  <text class="small muted" text-anchor="middle" data-bounds="22 53 698 694"><tspan x="491.5" y="236">workId</tspan></text>
  <path d="M357 303L103 303" fill="none" stroke="#2159A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-focus)"/>
  <text class="small focus" text-anchor="middle" data-bounds="22 53 698 694"><tspan x="231.5" y="293">持久化 workId</tspan></text>
  <path d="M363 360L617 360" fill="none" stroke="#52616F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <text class="small muted" text-anchor="middle" data-bounds="22 53 698 694"><tspan x="488.5" y="350">用 workId 准备执行</tspan></text>
  <path d="M617 417L363 417" fill="none" stroke="#52616F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#arrow-muted)"/>
  <text class="small muted" text-anchor="middle" data-bounds="22 53 698 694"><tspan x="491.5" y="407">executionId</tspan></text>
  <path d="M357 474L103 474" fill="none" stroke="#2159A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-focus)"/>
  <text class="small focus" text-anchor="middle" data-bounds="22 53 698 694"><tspan x="231.5" y="464">持久化 executionId</tspan></text>
  <path d="M363 531L617 531" fill="none" stroke="#52616F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <text class="small muted" text-anchor="middle" data-bounds="22 53 698 694"><tspan x="488.5" y="521">授权并带 submitId 提交</tspan></text>
  <path d="M617 588L363 588" fill="none" stroke="#52616F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#arrow-muted)"/>
  <text class="small muted" text-anchor="middle" data-bounds="22 53 698 694"><tspan x="491.5" y="578">runId</tspan></text>
  <path d="M357 645L103 645" fill="none" stroke="#2159A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-focus)"/>
  <text class="small focus" text-anchor="middle" data-bounds="22 53 698 694"><tspan x="231.5" y="635">持久化 runId</tspan></text>
</svg>
