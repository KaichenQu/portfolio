<svg xmlns="http://www.w3.org/2000/svg" width="720" height="293" viewBox="0 0 720 293" role="img" xml:lang="zh-CN">
  <title>R3F 的 useLoader 会缓存资源加载错误，由外层错误边界捕获，Suspense 负责加载中的回退界面。</title>
  <rect width="720" height="293" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <defs>
    <marker id="arrow-fail" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#A13834" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">R3F 加载错误边界</tspan></text>
  <rect x="28" y="64" width="664" height="196" rx="3" fill="#F4F7FA" stroke="#2159A6" stroke-width="1"/>
  <text class="label focus" text-anchor="start" data-bounds="22 53 698 281"><tspan x="43" y="89">错误边界</tspan></text>
  <rect x="44" y="104" width="440" height="140" rx="3" fill="#FFFFFF" stroke="#C5CDD5" stroke-width="1"/>
  <text class="mono strong" text-anchor="start" data-bounds="22 53 698 281"><tspan x="59" y="130">&lt;Suspense&gt;</tspan></text>
  <text class="small muted" text-anchor="start" data-bounds="22 53 698 281"><tspan x="217" y="130">加载中回退</tspan></text>
  <rect x="59" y="147" width="399" height="78" rx="3" fill="#EDF2F6" stroke="#C5CDD5" stroke-width="1"/>
  <text class="mono" text-anchor="start" data-bounds="22 53 698 281"><tspan x="75" y="175">&lt;Canvas&gt;</tspan></text>
  <text class="mono focus strong" text-anchor="start" data-bounds="22 53 698 281"><tspan x="75" y="203">useLoader</tspan></text>
  <text class="small fail" text-anchor="start" data-bounds="22 53 698 281"><tspan x="194" y="203">已缓存的资源错误</tspan></text>
  <path d="M458 198L524 198" fill="none" stroke="#A13834" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-fail)"/>
  <text class="small fail strong" text-anchor="start" data-bounds="22 53 698 281"><tspan x="537" y="203">在这里捕获</tspan></text>
</svg>
