<svg xmlns="http://www.w3.org/2000/svg" width="720" height="256" viewBox="0 0 720 256" role="img" xml:lang="zh-CN">
  <title>检查实际配置、钩子日志和跨面板依赖，可以识别三类不同的代理故障。</title>
  <rect width="720" height="256" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">代理行为的证据</tspan></text>
  <rect x="28" y="62" width="183" height="43" rx="0" fill="#F4F7FA" stroke="none" stroke-width="1"/>
  <path d="M28 62L692 62" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" text-anchor="start" data-bounds="37 65 205 102"><tspan x="42" y="86">运行时状态</tspan></text>
  <text text-anchor="start" data-bounds="224 65 692 102"><tspan x="229" y="86">对照实际配置和 MCP 工具列表</tspan></text>
  <rect x="28" y="105" width="183" height="43" rx="0" fill="#F4F7FA" stroke="none" stroke-width="1"/>
  <path d="M28 105L692 105" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" text-anchor="start" data-bounds="37 108 205 145"><tspan x="42" y="129">拦截器行为</tspan></text>
  <text text-anchor="start" data-bounds="224 108 692 145"><tspan x="229" y="129">查看钩子事件日志，确认实际工具与输入</tspan></text>
  <rect x="28" y="148" width="183" height="43" rx="0" fill="#F4F7FA" stroke="none" stroke-width="1"/>
  <path d="M28 148L692 148" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" text-anchor="start" data-bounds="37 151 205 188"><tspan x="42" y="172">协作归属</tspan></text>
  <text text-anchor="start" data-bounds="224 151 692 188"><tspan x="229" y="172">跨归属范围搜索所有 CSS 使用方</tspan></text>
  <rect x="28" y="191" width="183" height="43" rx="0" fill="#F4F7FA" stroke="none" stroke-width="1"/>
  <path d="M28 191L692 191" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" text-anchor="start" data-bounds="37 194 205 231"><tspan x="42" y="215">验收</tspan></text>
  <text text-anchor="start" data-bounds="224 194 692 231"><tspan x="229" y="215">合并前打开交付的截图</tspan></text>
  <path d="M28 234L692 234" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M211 62L211 234" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
