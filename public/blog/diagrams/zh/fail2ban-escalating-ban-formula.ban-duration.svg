<svg xmlns="http://www.w3.org/2000/svg" width="720" height="412" viewBox="0 0 720 412" role="img" xml:lang="zh-CN">
  <title>前两次封禁各一小时，之后升至 8、16 和 32 小时，最终达到 30 天上限。</title>
  <rect width="720" height="412" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">fail2ban 封禁时长递增</tspan></text>
  <path d="M223 66L223 349" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" text-anchor="start" data-bounds="23 65 216 113"><tspan x="27" y="88">第一次封禁</tspan></text>
  <rect x="223" y="75" width="10.0" height="16" rx="1" fill="#52616F" stroke="none" stroke-width="1"/>
  <text class="mono small" text-anchor="start" data-bounds="236.0 65 695 105"><tspan x="243.0" y="88">1 h</tspan></text>
  <text class="label" text-anchor="start" data-bounds="23 121 216 169"><tspan x="27" y="144">第二次封禁</tspan></text>
  <rect x="223" y="131" width="10.0" height="16" rx="1" fill="#52616F" stroke="none" stroke-width="1"/>
  <text class="mono small" text-anchor="start" data-bounds="236.0 121 695 161"><tspan x="243.0" y="144">1 h</tspan></text>
  <text class="label" text-anchor="start" data-bounds="23 177 216 225"><tspan x="27" y="200">第三次封禁</tspan></text>
  <rect x="223" y="187" width="80.0" height="16" rx="1" fill="#2159A6" stroke="none" stroke-width="1"/>
  <text class="mono small" text-anchor="start" data-bounds="306.0 177 695 217"><tspan x="313.0" y="200">8 h</tspan></text>
  <text class="label" text-anchor="start" data-bounds="23 233 216 281"><tspan x="27" y="256">第四次封禁</tspan></text>
  <rect x="223" y="243" width="160.0" height="16" rx="1" fill="#2159A6" stroke="none" stroke-width="1"/>
  <text class="mono small" text-anchor="start" data-bounds="386.0 233 695 273"><tspan x="393.0" y="256">16 h</tspan></text>
  <text class="label" text-anchor="start" data-bounds="23 289 216 337"><tspan x="27" y="312">第五次封禁</tspan></text>
  <rect x="223" y="299" width="320.0" height="16" rx="1" fill="#2159A6" stroke="none" stroke-width="1"/>
  <text class="mono small" text-anchor="start" data-bounds="546.0 289 695 329"><tspan x="553.0" y="312">32 h</tspan></text>
  <text class="mono small muted" text-anchor="start" data-bounds="22 53 698 400"><tspan x="223" y="365">0</tspan></text>
  <text class="small muted" text-anchor="start" data-bounds="22 53 698 400"><tspan x="28" y="394">从第十次起封禁时长上限为 30 天</tspan></text>
</svg>
