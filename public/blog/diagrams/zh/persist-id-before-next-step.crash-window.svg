<svg xmlns="http://www.w3.org/2000/svg" width="720" height="263" viewBox="0 0 720 263" role="img" xml:lang="zh-CN">
  <title>下一请求发出前持久化 id_k，崩溃或重载后就能凭它找到服务端的子对象。</title>
  <rect width="720" height="263" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">请求崩溃窗口</tspan></text>
  <rect x="28" y="64" width="320" height="173" rx="3" fill="#EDF2F6" stroke="#C5CDD5" stroke-width="1"/>
  <rect x="29" y="65" width="318" height="35" rx="0" fill="#F4F7FA" stroke="none" stroke-width="1"/>
  <path d="M28 101L348 101" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" text-anchor="start" data-bounds="36 66 339 100"><tspan x="42" y="87">仅保存在内存</tspan></text>
  <text text-anchor="start" data-bounds="36 103 339 235"><tspan x="42" y="126">第 k 步返回 id_k</tspan></text>
  <text text-anchor="start" data-bounds="36 103 339 235"><tspan x="42" y="150">发送第 k+1 步请求</tspan></text>
  <text class="fail" text-anchor="start" data-bounds="36 103 339 235"><tspan x="42" y="174">崩溃或重载</tspan></text>
  <text class="mono fail" text-anchor="start" data-bounds="36 103 339 235"><tspan x="42" y="198">id_k 丢失</tspan></text>
  <rect x="372" y="64" width="320" height="173" rx="3" fill="#EDF2F6" stroke="#C5CDD5" stroke-width="1"/>
  <rect x="373" y="65" width="318" height="35" rx="0" fill="#F4F7FA" stroke="none" stroke-width="1"/>
  <path d="M372 101L692 101" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" text-anchor="start" data-bounds="380 66 683 100"><tspan x="386" y="87">先写入再发送</tspan></text>
  <text text-anchor="start" data-bounds="380 103 683 235"><tspan x="386" y="126">第 k 步返回 id_k</tspan></text>
  <text class="focus strong" text-anchor="start" data-bounds="380 103 683 235"><tspan x="386" y="150">把 id_k 写入 sessionStorage</tspan></text>
  <text text-anchor="start" data-bounds="380 103 683 235"><tspan x="386" y="174">发送第 k+1 步请求</tspan></text>
  <text class="fail" text-anchor="start" data-bounds="380 103 683 235"><tspan x="386" y="198">崩溃或重载</tspan></text>
  <text class="pass" text-anchor="start" data-bounds="380 103 683 235"><tspan x="386" y="222">用 id_k 查找子对象</tspan></text>
</svg>
