<svg xmlns="http://www.w3.org/2000/svg" width="720" height="279" viewBox="0 0 720 279" role="img" xml:lang="zh-CN">
  <title>JWT 由点号分隔成三段，客户端可读取载荷里的 exp，服务端负责验签。</title>
  <rect width="720" height="279" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <text class="title" text-anchor="start" data-bounds="27 15 690 49"><tspan x="28" y="38">JWT 令牌结构</tspan></text>
  <rect x="28" y="99" width="156" height="56" rx="3" fill="#EDF2F6" stroke="#C5CDD5"/>
  <rect x="208" y="99" width="244" height="56" rx="3" fill="#EDF2F6" stroke="#C5CDD5"/>
  <rect x="476" y="99" width="216" height="56" rx="3" fill="#EDF2F6" stroke="#C5CDD5"/>
  <rect x="208" y="99" width="244" height="56" rx="3" fill="#F4F7FA" stroke="#2159A6"/>
  <text class="mono small muted" text-anchor="start" data-bounds="27 59 340 87"><tspan x="28" y="78">TradingView auth_token</tspan></text>
  <text class="mono label " text-anchor="middle" data-bounds="30 103 182 151"><tspan x="106" y="132">header</tspan></text>
  <text class="mono label " text-anchor="middle" data-bounds="186 103 206 151"><tspan x="196" y="132">.</tspan></text>
  <text class="mono label focus" text-anchor="middle" data-bounds="210 103 450 151"><tspan x="330" y="132">payload</tspan></text>
  <text class="mono label " text-anchor="middle" data-bounds="454 103 474 151"><tspan x="464" y="132">.</tspan></text>
  <text class="mono label " text-anchor="middle" data-bounds="478 103 690 151"><tspan x="584" y="132">signature</tspan></text>
  <path d="M330 156L330 181" fill="none" stroke="#2159A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M584 156L584 181" fill="none" stroke="#52616F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="330" cy="181" r="2.5" fill="#2159A6" stroke="none" stroke-width="1"/>
  <circle cx="584" cy="181" r="2.5" fill="#52616F" stroke="none" stroke-width="1"/>
  <text class="mono label focus" text-anchor="middle" data-bounds="210 190 450 221"><tspan x="330" y="211">exp</tspan></text>
  <text class="label" text-anchor="middle" data-bounds="477 190 691 221"><tspan x="584" y="211">签名校验</tspan></text>
  <text class="" text-anchor="middle" data-bounds="210 222 450 258"><tspan x="330" y="237">客户端读取过期时间戳</tspan></text>
  <text class="" text-anchor="middle" data-bounds="477 222 691 258"><tspan x="584" y="237">服务端验证令牌</tspan></text>
</svg>
