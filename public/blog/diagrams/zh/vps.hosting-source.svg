<svg xmlns="http://www.w3.org/2000/svg" width="720" height="247" viewBox="0 0 720 247" role="img" xml:lang="zh-CN">
  <title>词条示例中，fail2ban 封禁的六个地址均为托管 IP，分布在五个国家。</title>
  <rect width="720" height="247" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">托管 IP 查询证据</tspan></text>
  <text class="label" text-anchor="start" data-bounds="22 53 698 235"><tspan x="28" y="82">fail2ban 封禁的六个地址</tspan></text>
  <circle cx="50" cy="122" r="5" fill="#FFFFFF" stroke="#2159A6" stroke-width="1.5"/>
  <path d="M50 130L50 150" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="153" cy="122" r="5" fill="#FFFFFF" stroke="#2159A6" stroke-width="1.5"/>
  <path d="M153 130L153 150" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="256" cy="122" r="5" fill="#FFFFFF" stroke="#2159A6" stroke-width="1.5"/>
  <path d="M256 130L256 150" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="359" cy="122" r="5" fill="#FFFFFF" stroke="#2159A6" stroke-width="1.5"/>
  <path d="M359 130L359 150" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="462" cy="122" r="5" fill="#FFFFFF" stroke="#2159A6" stroke-width="1.5"/>
  <path d="M462 130L462 150" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="565" cy="122" r="5" fill="#FFFFFF" stroke="#2159A6" stroke-width="1.5"/>
  <path d="M565 130L565 150" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M50 150L565 150" fill="none" stroke="#C5CDD5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="mono focus strong" text-anchor="start" data-bounds="22 53 698 235"><tspan x="50" y="179">hosting: true</tspan></text>
  <text class="small" text-anchor="start" data-bounds="22 53 698 235"><tspan x="50" y="209">查询结果涉及五个国家</tspan></text>
</svg>
