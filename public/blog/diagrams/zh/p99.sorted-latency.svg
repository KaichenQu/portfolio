<svg xmlns="http://www.w3.org/2000/svg" width="720" height="256" viewBox="0 0 720 256" role="img" xml:lang="zh-CN">
  <title>在同一延迟刻度上，笔记示例的平均延迟为 20 ms，第 99 百分位延迟为 2 s。</title>
  <rect width="720" height="256" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <text class="title" text-anchor="start" data-bounds="27 15 690 49"><tspan x="28" y="38">平均延迟与 p99</tspan></text>
  <path d="M166 84L166 207" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M664 84L664 207" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M166 192H664" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="166" y="93" width="4.98" height="14" rx="0" fill="#52616F" stroke="none"/>
  <rect x="166" y="151" width="498" height="14" rx="0" fill="#2159A6" stroke="none"/>
  <text class="label" text-anchor="start" data-bounds="27 82 155 119"><tspan x="28" y="105">平均值</tspan></text>
  <text class="mono label" text-anchor="start" data-bounds="27 143 155 172"><tspan x="28" y="162">p99</tspan></text>
  <text class="small muted" text-anchor="start" data-bounds="27 169 155 194"><tspan x="28" y="184">第 99 百分位</tspan></text>
  <text class="mono strong" text-anchor="start" data-bounds="181 80 330 123"><tspan x="185" y="105">20 ms</tspan></text>
  <text class="mono strong" text-anchor="end" data-bounds="570 114 690 148"><tspan x="664" y="139">2 s</tspan></text>
  <text class="mono small muted" text-anchor="middle" data-bounds="155 210 178 238"><tspan x="166" y="227">0</tspan></text>
  <text class="small muted" text-anchor="end" data-bounds="520 208 690 239"><tspan x="664" y="227">延迟</tspan></text>
</svg>
