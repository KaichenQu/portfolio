<svg xmlns="http://www.w3.org/2000/svg" width="720" height="307" viewBox="0 0 720 307" role="img" xml:lang="zh-CN">
  <title>Playwright 在浏览器里打开自选列表抽屉，走完整个界面路径后核对可见结果。</title>
  <rect width="720" height="307" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <defs>
    <marker id="arrow-focus" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#2159A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-pass" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#246849" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">自选列表端到端测试</tspan></text>
  <path d="M100 103L100 279" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
  <text class="label" text-anchor="middle" data-bounds="26 55 196 102"><tspan x="100" y="83">Playwright</tspan></text>
  <path d="M360 103L360 279" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
  <text class="label" text-anchor="middle" data-bounds="264 55 456 102"><tspan x="360" y="83">浏览器</tspan></text>
  <path d="M620 103L620 279" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
  <text class="label" text-anchor="middle" data-bounds="524 55 695 102"><tspan x="620" y="83">自选列表界面</tspan></text>
  <path d="M103 132L357 132" fill="none" stroke="#2159A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-focus)"/>
  <text class="small focus" text-anchor="middle" data-bounds="22 53 698 295"><tspan x="228.5" y="122">点击自选列表控件</tspan></text>
  <path d="M363 189L617 189" fill="none" stroke="#2159A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-focus)"/>
  <text class="small focus" text-anchor="middle" data-bounds="22 53 698 295"><tspan x="488.5" y="179">打开抽屉</tspan></text>
  <path d="M617 246L103 246" fill="none" stroke="#246849" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-pass)"/>
  <rect x="358" y="219" width="4" height="22" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
  <text class="small pass" text-anchor="middle" data-bounds="22 53 698 295"><tspan x="361.5" y="236">断言抽屉可见</tspan></text>
</svg>
