<svg xmlns="http://www.w3.org/2000/svg" width="720" height="364" viewBox="0 0 720 364" role="img" xml:lang="zh-CN">
  <title>测试结果与 SITE_URL 一致，但 www 主机没有 DNS 记录，curl 无法解析。</title>
  <rect width="720" height="364" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <defs>
    <marker id="arrow-fail" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#A13834" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-focus" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#2159A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">规范链接主机检查</tspan></text>
  <path d="M100 103L100 336" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
  <text class="label" text-anchor="middle" data-bounds="26 55 196 102"><tspan x="100" y="83">生成的链接</tspan></text>
  <path d="M360 103L360 336" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
  <text class="label" text-anchor="middle" data-bounds="264 55 456 102"><tspan x="360" y="83">DNS</tspan></text>
  <path d="M620 103L620 336" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
  <text class="label" text-anchor="middle" data-bounds="524 55 695 102"><tspan x="620" y="83">HTTP 检查</tspan></text>
  <path d="M103 132L357 132" fill="none" stroke="#2159A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-focus)"/>
  <text class="small focus" text-anchor="middle" data-bounds="22 53 698 352"><tspan x="228.5" y="122">对 www 主机运行 dig +short</tspan></text>
  <path d="M357 189L103 189" fill="none" stroke="#A13834" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#arrow-fail)"/>
  <text class="small fail" text-anchor="middle" data-bounds="22 53 698 352"><tspan x="231.5" y="179">未返回记录</tspan></text>
  <path d="M103 246L617 246" fill="none" stroke="#2159A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-focus)"/>
  <rect x="358" y="219" width="4" height="22" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
  <text class="small focus" text-anchor="middle" data-bounds="22 53 698 352"><tspan x="358.5" y="236">请求规范链接</tspan></text>
  <path d="M617 303L103 303" fill="none" stroke="#A13834" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#arrow-fail)"/>
  <rect x="358" y="276" width="4" height="22" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
  <text class="small fail" text-anchor="middle" data-bounds="22 53 698 352"><tspan x="361.5" y="293">curl exit 6: Could not resolve host</tspan></text>
</svg>
