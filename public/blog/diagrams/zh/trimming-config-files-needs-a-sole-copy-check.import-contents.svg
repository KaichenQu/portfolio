<svg xmlns="http://www.w3.org/2000/svg" width="720" height="258" viewBox="0 0 720 258" role="img" xml:lang="zh-CN">
  <title>删除全局导入会抹掉 Agents 经验工作流的唯一副本，因此应先迁移，再移除导入。</title>
  <rect width="720" height="258" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <defs>
    <marker id="arrow-focus" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#2159A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">导入的指令内容</tspan></text>
  <rect x="28" y="64" width="300" height="165" rx="3" fill="#F4F7FA" stroke="#C5CDD5" stroke-width="1"/>
  <text class="label" text-anchor="start" data-bounds="22 53 698 246"><tspan x="43" y="92">导入的 AGENTS.md</tspan></text>
  <text class="small muted" text-anchor="start" data-bounds="22 53 698 246"><tspan x="43" y="124">笔记库说明</tspan></text>
  <path d="M43 138L307 138" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="focus strong" text-anchor="start" data-bounds="22 53 698 246"><tspan x="43" y="166">每个案例后提炼经验</tspan></text>
  <text class="small fail" text-anchor="start" data-bounds="22 53 698 246"><tspan x="43" y="194">唯一副本</tspan></text>
  <path d="M328 162L406 162" fill="none" stroke="#2159A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-focus)"/>
  <rect x="416" y="118" width="276" height="89" rx="3" fill="#FFFFFF" stroke="#2159A6" stroke-width="1"/>
  <text class="mono focus strong" text-anchor="start" data-bounds="22 53 698 246"><tspan x="431" y="146">/devlog workflow</tspan></text>
  <text class="small" text-anchor="start" data-bounds="22 53 698 246"><tspan x="431" y="174">把唯一的指令移到这里</tspan></text>
</svg>
