<svg xmlns="http://www.w3.org/2000/svg" width="720" height="399" viewBox="0 0 720 399" role="img" xml:lang="zh-CN">
  <title>根据要找的证据选 Git 命令，例如代码行作者、回归提交或丢失的引用。</title>
  <rect width="720" height="399" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <text class="title" text-anchor="start" data-bounds="27 15 690 49"><tspan x="28" y="38">Git 排查命令</tspan></text>
  <rect x="28" y="70" width="664" height="34" rx="0" fill="#F4F7FA" stroke="none"/>
  <rect x="270" y="104" width="422" height="266" rx="0" fill="#EDF2F6" stroke="none"/>
  <text class="label" text-anchor="start" data-bounds="38 71 261 103"><tspan x="42" y="92">要查的证据</tspan></text>
  <text class="label" text-anchor="start" data-bounds="280 71 682 103"><tspan x="286" y="92">Git 命令</tspan></text>
  <path d="M28 104H692" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="" text-anchor="start" data-bounds="38 109 263 159"><tspan x="42" y="136">第 40–60 行由谁最后修改？</tspan></text>
  <text class="mono" text-anchor="start" data-bounds="280 109 688 159"><tspan x="286" y="136">git blame -L 40,60 &lt;file&gt;</tspan></text>
  <path d="M28 162H692" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="" text-anchor="start" data-bounds="38 167 263 237"><tspan x="42" y="194">哪个提交引入了回归？</tspan></text>
  <text class="mono" text-anchor="start" data-bounds="280 167 688 237"><tspan x="286" y="194">git bisect start &lt;bad&gt; &lt;good&gt;</tspan><tspan x="286" y="216">git bisect run &lt;test-cmd&gt;</tspan></text>
  <path d="M28 240H692" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="" text-anchor="start" data-bounds="38 245 263 315"><tspan x="42" y="272">哪个提交增删了这段文本？</tspan></text>
  <text class="mono" text-anchor="start" data-bounds="280 245 688 315"><tspan x="286" y="272">git log -S &quot;&lt;string&gt;&quot;</tspan><tspan x="286" y="294">git log -G &quot;&lt;regex&gt;&quot;</tspan></text>
  <path d="M28 318H692" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="" text-anchor="start" data-bounds="38 323 263 367"><tspan x="42" y="349">丢失的提交在哪里？</tspan></text>
  <text class="mono" text-anchor="start" data-bounds="280 323 688 367"><tspan x="286" y="349">git reflog</tspan></text>
  <path d="M28 370H692" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
