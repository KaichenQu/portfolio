<svg xmlns="http://www.w3.org/2000/svg" width="720" height="246" viewBox="0 0 720 246" role="img" xml:lang="zh-CN">
  <title>把 MCP 服务器注册到 Claude Code 读取的范围后，数据源工具会出现在会话工具列表中。</title>
  <rect width="720" height="246" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <defs>
    <marker id="arrow-focus" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#2159A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">MCP 会话工具范围</tspan></text>
  <text class="label" text-anchor="start" data-bounds="22 53 698 234"><tspan x="28" y="84">MCP 数据源</tspan></text>
  <text class="muted" text-anchor="start" data-bounds="22 53 698 234"><tspan x="28" y="110">工具与资源</tspan></text>
  <path d="M29 157L295 157" fill="none" stroke="#2159A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-focus)"/>
  <text class="mono small" text-anchor="middle" data-bounds="22 53 698 234"><tspan x="155" y="144">claude mcp add</tspan></text>
  <rect x="305" y="67" width="387" height="151" rx="3" fill="#F4F7FA" stroke="#C5CDD5" stroke-width="1"/>
  <text class="label" text-anchor="start" data-bounds="22 53 698 234"><tspan x="321" y="95">Claude Code 会话</tspan></text>
  <rect x="321" y="115" width="355" height="85" rx="3" fill="#FFFFFF" stroke="#2159A6" stroke-width="1"/>
  <text class="label focus" text-anchor="start" data-bounds="22 53 698 234"><tspan x="337" y="142">会话工具列表</tspan></text>
  <text text-anchor="start" data-bounds="22 53 698 234"><tspan x="337" y="171">已注册的数据源工具</tspan></text>
</svg>
