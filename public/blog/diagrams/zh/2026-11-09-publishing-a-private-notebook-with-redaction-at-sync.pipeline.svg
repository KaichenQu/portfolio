<svg xmlns="http://www.w3.org/2000/svg" width="720" height="351" viewBox="0 0 720 351" role="img" xml:lang="zh-CN">
  <title>同步时先在内存中给笔记脱敏，通过十种文本视图检查后才写入镜像并发布。</title>
  <rect width="720" height="351" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <defs>
    <marker id="arrow-muted" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#52616F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-pass" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#246849" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">笔记发布边界</tspan></text>
  <rect x="28" y="65" width="198" height="228" rx="3" fill="#F4F7FA" stroke="#C5CDD5" stroke-width="1"/>
  <text class="label" text-anchor="start" data-bounds="22 53 698 339"><tspan x="43" y="91">私有笔记库</tspan></text>
  <text class="small" text-anchor="start" data-bounds="22 53 698 339"><tspan x="43" y="120">笔记与 Diagrams/</tspan></text>
  <text class="small" text-anchor="start" data-bounds="22 53 698 339"><tspan x="43" y="147">脱敏规则</tspan></text>
  <path d="M191 195L248 195" fill="none" stroke="#52616F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <rect x="250" y="65" width="216" height="228" rx="3" fill="#FFFFFF" stroke="#2159A6" stroke-width="1"/>
  <text class="label focus" text-anchor="start" data-bounds="22 53 698 339"><tspan x="264" y="91">内存中同步</tspan></text>
  <text class="small" text-anchor="start" data-bounds="22 53 698 339"><tspan x="264" y="120">去掉私有元数据</tspan></text>
  <text class="small" text-anchor="start" data-bounds="22 53 698 339"><tspan x="264" y="147">遮盖命中文本</tspan></text>
  <path d="M264 164L451 164" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="small strong" text-anchor="start" data-bounds="22 53 698 339"><tspan x="264" y="189">核对十种文本视图</tspan></text>
  <text class="small fail" text-anchor="start" data-bounds="22 53 698 339"><tspan x="264" y="258">任一命中都会在写入前中止</tspan></text>
  <path d="M263 220l10 10m0 -10l-10 10" fill="none" stroke="#A13834" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M466 195L484 195" fill="none" stroke="#246849" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-pass)"/>
  <rect x="491" y="65" width="201" height="228" rx="3" fill="#F4F7FA" stroke="#C5CDD5" stroke-width="1"/>
  <text class="label" text-anchor="start" data-bounds="501 75 692 281"><tspan x="506" y="91">脱敏镜像</tspan></text>
  <text class="mono small" text-anchor="start" data-bounds="501 75 692 281"><tspan x="506" y="120">content/devlog/</tspan></text>
  <text class="mono small" text-anchor="start" data-bounds="501 75 692 281"><tspan x="506" y="145">public/blog/diagrams/</tspan></text>
  <text class="small" text-anchor="start" data-bounds="501 75 692 281"><tspan x="506" y="219">GitHub main</tspan></text>
  <text class="small" text-anchor="start" data-bounds="501 75 692 281"><tspan x="506" y="242">Vercel 部署</tspan></text>
  <text class="mono focus" text-anchor="start" data-bounds="501 75 692 281"><tspan x="506" y="268">/blog</tspan></text>
</svg>
