<svg xmlns="http://www.w3.org/2000/svg" width="720" height="259" viewBox="0 0 720 259" role="img" xml:lang="zh-CN">
  <title>先直接实现第一个实际用例，等第二个实际用例出现后，再找值得共用的部分。</title>
  <rect width="720" height="259" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <defs>
    <marker id="arrow-focus" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#2159A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">抽象时机</tspan></text>
  <text class="label" text-anchor="start" data-bounds="22 53 698 247"><tspan x="28" y="81">第一个实际用例</tspan></text>
  <rect x="28" y="95" width="245" height="113" rx="3" fill="#F4F7FA" stroke="#C5CDD5" stroke-width="1"/>
  <text class="strong" text-anchor="start" data-bounds="22 53 698 247"><tspan x="43" y="132">直接实现</tspan></text>
  <text class="small muted" text-anchor="start" data-bounds="22 53 698 247"><tspan x="43" y="161">解决当前需求</tspan></text>
  <path d="M274 152L348 152" fill="none" stroke="#2159A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-focus)"/>
  <text class="label" text-anchor="start" data-bounds="22 53 698 247"><tspan x="365" y="81">第二个实际用例出现</tspan></text>
  <rect x="366" y="95" width="186" height="113" rx="3" fill="#FFFFFF" stroke="#C5CDD5" stroke-width="1"/>
  <rect x="504" y="95" width="188" height="113" rx="3" fill="#FFFFFF" stroke="#C5CDD5" stroke-width="1"/>
  <rect x="504" y="95" width="48" height="113" rx="0" fill="#EDF2F6" stroke="#2159A6" stroke-width="1"/>
  <text class="small" text-anchor="start" data-bounds="22 53 698 247"><tspan x="383" y="137">第一个用例</tspan></text>
  <text class="small" text-anchor="start" data-bounds="22 53 698 247"><tspan x="569" y="137">第二个用例</tspan></text>
  <path d="M528 208L528 222" fill="none" stroke="#2159A6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
