<svg xmlns="http://www.w3.org/2000/svg" width="720" height="256" viewBox="0 0 720 256" role="img" xml:lang="zh-CN">
  <title>内部目标设为 99.95%，可在可用性降到对外承诺的 99.9% 之前触发排查。</title>
  <rect width="720" height="256" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <defs>
    <marker id="arrow-muted" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#52616F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">可用性目标余量</tspan></text>
  <path d="M53 139L673 139" fill="none" stroke="#52616F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <rect x="215" y="131" width="299" height="16" rx="2" fill="#F4F7FA" stroke="#2159A6" stroke-width="1"/>
  <path d="M215 119L215 158" fill="none" stroke="#A13834" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M514 119L514 158" fill="none" stroke="#2159A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="mono small fail" text-anchor="middle" data-bounds="22 53 698 244"><tspan x="215" y="104">对外 SLA 99.9%</tspan></text>
  <text class="mono small focus" text-anchor="middle" data-bounds="22 53 698 244"><tspan x="514" y="104">内部 SLO 99.95%</tspan></text>
  <text class="label focus" text-anchor="middle" data-bounds="22 53 698 244"><tspan x="365" y="177">可提前排查的余量</tspan></text>
  <text class="small muted" text-anchor="end" data-bounds="22 53 698 244"><tspan x="671" y="218">可用性更高</tspan></text>
</svg>
