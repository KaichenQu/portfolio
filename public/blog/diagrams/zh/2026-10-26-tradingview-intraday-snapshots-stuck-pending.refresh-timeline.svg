<svg xmlns="http://www.w3.org/2000/svg" width="720" height="313" viewBox="0 0 720 313" role="img" xml:lang="zh-CN">
  <title>TV_TOKEN 有效期约四小时，提前十分钟刷新可避免日内请求进入 SNAPSHOT_PENDING。</title>
  <rect width="720" height="313" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <defs>
    <marker id="arrow-pass" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#246849" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">TradingView 令牌刷新</tspan></text>
  <text class="label" text-anchor="start" data-bounds="22 53 698 301"><tspan x="27" y="93">刷新前</tspan></text>
  <text class="label" text-anchor="start" data-bounds="22 53 698 301"><tspan x="27" y="191">加入刷新后</tspan></text>
  <path d="M174 103L688 103" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M174 201L688 201" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M174 103L553 103" fill="none" stroke="#2159A6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M553 103L688 103" fill="none" stroke="#A13834" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
  <path d="M174 201L537.2 201" fill="none" stroke="#2159A6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M537.2 201L688 201" fill="none" stroke="#246849" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-pass)"/>
  <path d="M553 78L553 137" fill="none" stroke="#A13834" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
  <path d="M548 98l10 10m0 -10l-10 10" fill="none" stroke="#A13834" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="small mono" text-anchor="start" data-bounds="22 53 698 301"><tspan x="174" y="85">签发 TV_TOKEN</tspan></text>
  <text class="small fail" text-anchor="middle" data-bounds="22 53 698 301"><tspan x="553" y="72">JWT 约 4 小时后到期</tspan></text>
  <text class="small mono fail" text-anchor="end" data-bounds="22 53 698 301"><tspan x="688" y="127">SNAPSHOT_PENDING</tspan></text>
  <path d="M537.2 162L537.2 211" fill="none" stroke="#2159A6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
  <circle cx="537.2" cy="201" r="5" fill="#246849" stroke="none" stroke-width="1.5"/>
  <text class="small focus" text-anchor="end" data-bounds="22 53 698 301"><tspan x="526.2" y="169">到期前 10 分钟刷新</tspan></text>
  <text class="small pass" text-anchor="end" data-bounds="22 53 698 301"><tspan x="688" y="225">新 JWT 有效期</tspan></text>
  <text class="small muted" text-anchor="start" data-bounds="22 53 698 301"><tspan x="174" y="266">日线无需 TV_TOKEN，继续更新</tspan></text>
</svg>
