<svg xmlns="http://www.w3.org/2000/svg" width="720" height="207" viewBox="0 0 720 207" role="img" xml:lang="zh-CN">
  <title>chezmoi 从源文件名 dot_zshrc.tmpl 识别模板，apply 渲染后写入主目录的 .zshrc。</title>
  <rect width="720" height="207" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <defs>
    <marker id="arrow-focus" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#2159A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">chezmoi 源文件名</tspan></text>
  <rect x="28" y="68" width="312" height="55" rx="3" fill="#EDF2F6" stroke="#C5CDD5" stroke-width="1"/>
  <text class="mono strong" text-anchor="start" data-bounds="39 69 333 119"><tspan x="46" y="103">dot_zshrc.tmpl</tspan></text>
  <rect x="487" y="68" width="205" height="55" rx="3" fill="#EDF2F6" stroke="#2159A6" stroke-width="1"/>
  <text class="mono focus strong" text-anchor="start" data-bounds="492 69 685 119"><tspan x="504" y="103">.zshrc</tspan></text>
  <path d="M345 95L480 95" fill="none" stroke="#2159A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-focus)"/>
  <text class="mono small" text-anchor="middle" data-bounds="22 53 698 195"><tspan x="413" y="82">chezmoi apply</tspan></text>
  <path d="M46 116V138H68V150" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M149 116V138H240V150" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="small" text-anchor="start" data-bounds="22 53 698 195"><tspan x="43" y="171">dot_ 对应开头的点</tspan></text>
  <text class="small" text-anchor="start" data-bounds="22 53 698 195"><tspan x="241" y="171">.tmpl 表示 Go 模板</tspan></text>
  <text class="small muted" text-anchor="start" data-bounds="22 53 698 195"><tspan x="505" y="171">主目录</tspan></text>
</svg>
