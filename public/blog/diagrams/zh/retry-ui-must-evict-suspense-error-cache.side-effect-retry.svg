<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270" role="img" xml:lang="zh-CN">
  <title>重置 hasError 后 useLoader 的失败条目仍在缓存中，清除它才会重新执行加载。</title>
  <rect width="720" height="270" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <defs>
    <marker id="arrow-focus" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#2159A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#52616F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-pass" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#246849" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">查看器重试与缓存</tspan></text>
  <rect x="299" y="64" width="198" height="175" rx="3" fill="#F4F7FA" stroke="#C5CDD5" stroke-width="1"/>
  <text class="label" text-anchor="start" data-bounds="307 65 493 96"><tspan x="314" y="86">suspend-react 缓存</tspan></text>
  <path d="M28 146L692 146" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="mono" text-anchor="start" data-bounds="22 53 698 258"><tspan x="28" y="125">重置 hasError</tspan></text>
  <path d="M171 121L305 121" fill="none" stroke="#52616F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <text class="fail" text-anchor="start" data-bounds="22 53 698 258"><tspan x="314" y="125">保留 entry.error</tspan></text>
  <path d="M505 116l10 10m0 -10l-10 10" fill="none" stroke="#A13834" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="small fail" text-anchor="start" data-bounds="22 53 698 258"><tspan x="524" y="125">无新请求</tspan></text>
  <text class="mono small focus" text-anchor="start" data-bounds="22 53 698 258"><tspan x="28" y="193">useLoader.clear(loader, input)</tspan></text>
  <path d="M292 188L305 188" fill="none" stroke="#2159A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-focus)"/>
  <text class="focus" text-anchor="start" data-bounds="22 53 698 258"><tspan x="314" y="193">缓存条目已清除</tspan></text>
  <path d="M497 188L518 188" fill="none" stroke="#246849" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-pass)"/>
  <text class="small pass" text-anchor="start" data-bounds="22 53 698 258"><tspan x="524" y="193">重新执行加载</tspan></text>
</svg>
