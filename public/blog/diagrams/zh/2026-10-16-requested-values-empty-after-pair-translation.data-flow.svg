<svg xmlns="http://www.w3.org/2000/svg" width="720" height="263" viewBox="0 0 720 263" role="img" xml:lang="zh-CN">
  <title>两次序列化 +Y 1 mm 要求使 requested 为空，尽管四个实测变化都符合要求，偏差检查仍被跳过。</title>
  <rect width="720" height="263" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">成对平移结果</tspan></text>
  <rect x="28" y="64" width="320" height="173" rx="3" fill="#EDF2F6" stroke="#C5CDD5" stroke-width="1"/>
  <rect x="29" y="65" width="318" height="35" rx="0" fill="#F4F7FA" stroke="none" stroke-width="1"/>
  <path d="M28 101L348 101" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" text-anchor="start" data-bounds="36 66 339 100"><tspan x="42" y="87">B1 生成两条要求</tspan></text>
  <text class="mono" text-anchor="start" data-bounds="36 103 339 235"><tspan x="42" y="126">焊印 1：+Y 1 mm</tspan></text>
  <text class="mono" text-anchor="start" data-bounds="36 103 339 235"><tspan x="42" y="150">焊印 2：+Y 1 mm</tspan></text>
  <text class="mono fail" text-anchor="start" data-bounds="36 103 339 235"><tspan x="42" y="174">requested = null</tspan></text>
  <text class="fail" text-anchor="start" data-bounds="36 103 339 235"><tspan x="42" y="198">跳过偏差检查</tspan></text>
  <text text-anchor="start" data-bounds="36 103 339 235"><tspan x="42" y="222">四个实测值均为 +1 mm</tspan></text>
  <rect x="372" y="64" width="320" height="173" rx="3" fill="#EDF2F6" stroke="#C5CDD5" stroke-width="1"/>
  <rect x="373" y="65" width="318" height="35" rx="0" fill="#F4F7FA" stroke="none" stroke-width="1"/>
  <path d="M372 101L692 101" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" text-anchor="start" data-bounds="380 66 683 100"><tspan x="386" y="87">合并为一条要求</tspan></text>
  <text text-anchor="start" data-bounds="380 103 683 235"><tspan x="386" y="126">同轴同向</tspan></text>
  <text text-anchor="start" data-bounds="380 103 683 235"><tspan x="386" y="150">同为 +Y 1 mm 平移</tspan></text>
  <text class="pass" text-anchor="start" data-bounds="380 103 683 235"><tspan x="386" y="174">要求值恢复</tspan></text>
  <text class="pass" text-anchor="start" data-bounds="380 103 683 235"><tspan x="386" y="198">四项偏差均为 0</tspan></text>
  <text text-anchor="start" data-bounds="380 103 683 235"><tspan x="386" y="222">运行成功</tspan></text>
</svg>
