<svg xmlns="http://www.w3.org/2000/svg" width="720" height="275" viewBox="0 0 720 275" role="img" xml:lang="zh-CN">
  <title>放弃恢复前先检查 Work 的执行，有可恢复执行就接回，避免把卡片标成未运行。</title>
  <rect width="720" height="275" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <defs>
    <marker id="arrow-muted" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#52616F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">放弃恢复判定</tspan></text>
  <rect x="122" y="63" width="476" height="40" rx="3" fill="#F4F7FA" stroke="#C5CDD5" stroke-width="1"/>
  <text class="label" text-anchor="middle" data-bounds="125 65 595 102"><tspan x="360" y="88">已有 workId 时，是否有非终态执行？</tspan></text>
  <path d="M360 104V122H189V147" fill="none" stroke="#52616F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <circle cx="189" cy="153" r="4" fill="#2159A6" stroke="none" stroke-width="1.5"/>
  <text class="label focus" text-anchor="middle" data-bounds="22 53 698 234"><tspan x="189" y="176">有</tspan></text>
  <text text-anchor="middle" data-bounds="36 187 342 235"><tspan x="189" y="204">接回已有执行</tspan><tspan x="189" y="225">卡片保持可恢复</tspan></text>
  <path d="M360 104V122H531V147" fill="none" stroke="#52616F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <circle cx="531" cy="153" r="4" fill="neutral" stroke="none" stroke-width="1.5"/>
  <text class="label neutral" text-anchor="middle" data-bounds="22 53 698 234"><tspan x="531" y="176">无</tspan></text>
  <text text-anchor="middle" data-bounds="378 187 684 235"><tspan x="531" y="204">本地标记为已放弃</tspan><tspan x="531" y="225">保留 createId</tspan></text>
  <text class="small muted" data-bounds="26 231 690 268"><tspan x="28" y="251">没有 workId 时不发送请求</tspan></text>
</svg>
