<svg xmlns="http://www.w3.org/2000/svg" width="720" height="278" viewBox="0 0 720 278" role="img" xml:lang="en">
  <title>The open Azure SAS stream can cross the ten-minute expiry, while a new request at minute 12 receives HTTP 403.</title>
  <rect width="720" height="278" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <defs>
    <marker id="arrow-muted" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#52616F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-pass" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#246849" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">Signed download expiry</tspan></text>
  <rect x="158" y="66" width="370" height="32" rx="3" fill="#F4F7FA" stroke="#2159A6" stroke-width="1"/>
  <text class="focus strong" text-anchor="start" data-bounds="163 68 518 97"><tspan x="171" y="87">Azure SAS validity</tspan></text>
  <path d="M158 111L687 111" fill="none" stroke="#52616F" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <path d="M528 60L528 115" fill="none" stroke="#A13834" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
  <path d="M528 140L528 232" fill="none" stroke="#A13834" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
  <text class="mono small" text-anchor="start" data-bounds="22 53 698 266"><tspan x="158" y="133">st=</tspan></text>
  <text class="mono small fail" text-anchor="middle" data-bounds="22 53 698 266"><tspan x="528" y="133">se= at 10 min</tspan></text>
  <text class="label" text-anchor="start" data-bounds="22 53 698 266"><tspan x="28" y="173">Open stream</tspan></text>
  <path d="M176 168L685 168" fill="none" stroke="#246849" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-pass)"/>
  <text class="small pass" text-anchor="middle" data-bounds="22 53 698 266"><tspan x="615" y="158">Continues</tspan></text>
  <text class="label" text-anchor="start" data-bounds="22 53 698 266"><tspan x="28" y="224">New request</tspan></text>
  <path d="M602 218L676 218" fill="none" stroke="#A13834" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
  <path d="M597 213l10 10m0 -10l-10 10" fill="none" stroke="#A13834" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="small fail" text-anchor="middle" data-bounds="22 53 698 266"><tspan x="602" y="208">12 min</tspan></text>
  <text class="mono fail strong" text-anchor="end" data-bounds="22 53 698 266"><tspan x="689" y="245">HTTP 403</tspan></text>
</svg>
