<svg xmlns="http://www.w3.org/2000/svg" width="720" height="254" viewBox="0 0 720 254" role="img" xml:lang="en">
  <title>Filling in the base URL, key and model makes the app use the user’s LLM provider in place of the default.</title>
  <rect width="720" height="254" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <defs>
    <marker id="arrow-focus" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#2159A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">LLM provider settings</tspan></text>
  <rect x="28" y="63" width="321" height="162" rx="3" fill="#F4F7FA" stroke="#C5CDD5" stroke-width="1"/>
  <text class="label focus" text-anchor="start" data-bounds="22 53 698 242"><tspan x="44" y="89">BYO-LLM</tspan></text>
  <rect x="157" y="100" width="172" height="25" rx="3" fill="#FFFFFF" stroke="#C5CDD5" stroke-width="1"/>
  <text class="small strong" text-anchor="start" data-bounds="22 53 698 242"><tspan x="44" y="117">Base URL</tspan></text>
  <rect x="157" y="135" width="172" height="25" rx="3" fill="#FFFFFF" stroke="#C5CDD5" stroke-width="1"/>
  <text class="small strong" text-anchor="start" data-bounds="22 53 698 242"><tspan x="44" y="152">Key</tspan></text>
  <rect x="157" y="170" width="172" height="25" rx="3" fill="#FFFFFF" stroke="#C5CDD5" stroke-width="1"/>
  <text class="small strong" text-anchor="start" data-bounds="22 53 698 242"><tspan x="44" y="187">Model</tspan></text>
  <path d="M350 145L455 145" fill="none" stroke="#2159A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-focus)"/>
  <text class="label focus" text-anchor="start" data-bounds="22 53 698 242"><tspan x="472" y="142">User provider active</tspan></text>
  <text class="small muted" text-anchor="start" data-bounds="22 53 698 242"><tspan x="472" y="171">Default provider overridden</tspan></text>
</svg>
