<svg xmlns="http://www.w3.org/2000/svg" width="720" height="234" viewBox="0 0 720 234" role="img" xml:lang="en">
  <title>Checking the path and field a tool actually reads explains why valid hand-written MCP JSON can have no effect.</title>
  <rect width="720" height="234" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">Effective configuration read</tspan></text>
  <text class="label" text-anchor="start" data-bounds="22 53 698 222"><tspan x="28" y="86">Valid JSON at a guessed path</tspan></text>
  <path d="M297 77l8 8m0 -8l-8 8" fill="none" stroke="#A13834" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="small fail" text-anchor="start" data-bounds="22 53 698 222"><tspan x="316" y="86">Ignored if the tool reads elsewhere</tspan></text>
  <rect x="28" y="110" width="664" height="52" rx="3" fill="#EDF2F6" stroke="#C5CDD5" stroke-width="1"/>
  <text class="mono focus strong" text-anchor="start" data-bounds="39 114 685 160"><tspan x="44" y="141">claude mcp add &lt;name&gt; --scope user -- &lt;command&gt;</tspan></text>
  <path d="M242 163L242 185" fill="none" stroke="#2159A6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="small" text-anchor="start" data-bounds="22 53 698 222"><tspan x="256" y="203">CLI selects the active config for this scope</tspan></text>
</svg>
