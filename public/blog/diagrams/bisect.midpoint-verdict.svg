<svg xmlns="http://www.w3.org/2000/svg" width="720" height="258" viewBox="0 0 720 258" role="img" xml:lang="en">
  <title>A midpoint verdict halves the suspect range, and the note’s regression hunt took eight checks across 200 commits.</title>
  <rect width="720" height="258" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">Git bisect midpoint</tspan></text>
  <text class="small" text-anchor="middle" data-bounds="22 53 698 246"><tspan x="72" y="88">Known good</tspan></text>
  <circle cx="72" cy="111" r="5" fill="#FFFFFF" stroke="#52616F" stroke-width="1.5"/>
  <text class="small" text-anchor="middle" data-bounds="22 53 698 246"><tspan x="360" y="88">Midpoint</tspan></text>
  <circle cx="360" cy="111" r="5" fill="#FFFFFF" stroke="#52616F" stroke-width="1.5"/>
  <text class="small" text-anchor="middle" data-bounds="22 53 698 246"><tspan x="651" y="88">Known bad</tspan></text>
  <circle cx="651" cy="111" r="5" fill="#FFFFFF" stroke="#52616F" stroke-width="1.5"/>
  <path d="M79 111L353 111" fill="none" stroke="#52616F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M367 111L644 111" fill="none" stroke="#52616F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" text-anchor="start" data-bounds="22 53 698 246"><tspan x="28" y="153">If the midpoint is bad</tspan></text>
  <path d="M72 175L360 175" fill="none" stroke="#2159A6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="72" cy="175" r="5" fill="#2159A6" stroke="none" stroke-width="1.5"/>
  <circle cx="360" cy="175" r="5" fill="#A13834" stroke="none" stroke-width="1.5"/>
  <path d="M367 175L651 175" fill="none" stroke="#C5CDD5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
  <text class="small focus" text-anchor="middle" data-bounds="22 53 698 246"><tspan x="211" y="203">Keep this half</tspan></text>
  <text class="small muted" text-anchor="end" data-bounds="22 53 698 246"><tspan x="651" y="230">Example: 200 commits in 8 checks</tspan></text>
</svg>
