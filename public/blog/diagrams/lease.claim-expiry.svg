<svg xmlns="http://www.w3.org/2000/svg" width="720" height="303" viewBox="0 0 720 303" role="img" xml:lang="en">
  <title>While card 1 holds the task lease, card 2 gets a conflict and can try to acquire it again after expiry.</title>
  <rect width="720" height="303" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <text class="title" text-anchor="start" data-bounds="27 15 690 49"><tspan x="28" y="38">Task lease expiry</tspan></text>
  <defs>
    <marker id="arrow-muted" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#52616F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <path d="M150 251H691" fill="none" stroke="#52616F" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <path d="M150 99L150 251" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M502 86L502 251" fill="none" stroke="#52616F" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
  <rect x="150" y="101" width="352" height="39" rx="3" fill="#F4F7FA" stroke="#2159A6"/>
  <rect x="502" y="101" width="190" height="39" rx="3" fill="#F4F7FA" stroke="#C5CDD5"/>
  <text class="label" text-anchor="start" data-bounds="27 102 140 139"><tspan x="28" y="125">Task lease</tspan></text>
  <text class="focus strong" text-anchor="start" data-bounds="157 102 490 138"><tspan x="165" y="125">Card 1 holds lease</tspan></text>
  <text class="strong" text-anchor="start" data-bounds="509 102 688 138"><tspan x="517" y="125">Available</tspan></text>
  <text class="mono" text-anchor="start" data-bounds="147 57 486 85"><tspan x="150" y="76">/executions/{id}/recover</tspan></text>
  <text class="label" text-anchor="middle" data-bounds="450 57 554 85"><tspan x="502" y="76">Expiry</tspan></text>
  <text class="label" text-anchor="start" data-bounds="27 171 140 203"><tspan x="28" y="192">Card 2</tspan></text>
  <path d="M150 190H691" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="205" cy="190" r="4" fill="#A13834" stroke="none" stroke-width="1"/>
  <circle cx="554" cy="190" r="4" fill="#FFFFFF" stroke="#2159A6" stroke-width="1.6"/>
  <text class="mono" text-anchor="start" data-bounds="197 148 490 183"><tspan x="205" y="172">POST /works</tspan></text>
  <text class="mono fail strong" text-anchor="start" data-bounds="198 195 490 231"><tspan x="205" y="217">409 TASK_ACTIVITY_CONFLICT</tspan></text>
  <text class="small focus strong" text-anchor="start" data-bounds="513 195 691 232"><tspan x="522" y="217">Retry with same identity</tspan></text>
  <text class="small muted" text-anchor="end" data-bounds="595 258 693 290"><tspan x="690" y="277">Time</tspan></text>
</svg>
