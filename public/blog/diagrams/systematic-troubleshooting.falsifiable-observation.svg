<svg xmlns="http://www.w3.org/2000/svg" width="720" height="284" viewBox="0 0 720 284" role="img" xml:lang="en">
  <title>An expected-versus-actual difference suggests a check with an outcome that can disprove the hypothesis.</title>
  <rect width="720" height="284" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <defs>
    <marker id="arrow-muted" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#52616F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">Troubleshooting hypothesis test</tspan></text>
  <text class="label" text-anchor="start" data-bounds="22 53 698 272"><tspan x="28" y="76">Expected</tspan></text>
  <text text-anchor="start" data-bounds="22 53 698 272"><tspan x="136" y="76">Server in tool list</tspan></text>
  <text class="label" text-anchor="start" data-bounds="22 53 698 272"><tspan x="28" y="104">Observed</tspan></text>
  <text class="fail" text-anchor="start" data-bounds="22 53 698 272"><tspan x="136" y="104">Server absent</tspan></text>
  <path d="M28 119L692 119" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" text-anchor="start" data-bounds="22 53 698 272"><tspan x="28" y="149">Hypothesis</tspan></text>
  <text class="focus" text-anchor="start" data-bounds="22 53 698 272"><tspan x="136" y="149">Client reads another config path</tspan></text>
  <text class="label" text-anchor="start" data-bounds="22 53 698 272"><tspan x="28" y="178">Observation</tspan></text>
  <text class="focus" text-anchor="start" data-bounds="22 53 698 272"><tspan x="136" y="178">Check the path the CLI actually reads</tspan></text>
  <path d="M335 189V206H132V225" fill="none" stroke="#52616F" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <path d="M335 206H511V225" fill="none" stroke="#52616F" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <text class="small fail" text-anchor="middle" data-bounds="22 53 698 272"><tspan x="132" y="249">Same path rules it out</tspan></text>
  <text class="small pass" text-anchor="middle" data-bounds="22 53 698 272"><tspan x="511" y="249">Different path supports it</tspan></text>
</svg>
