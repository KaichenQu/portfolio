<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270" role="img" xml:lang="en">
  <title>The note’s storage example compares mainland OSS requiring an ICP-filed CNAME with Hong Kong OSS and the default mainland COS endpoint.</title>
  <rect width="720" height="270" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">ICP and object storage</tspan></text>
  <rect x="28" y="62" width="664" height="38" rx="0" fill="#F4F7FA" stroke="none" stroke-width="1"/>
  <text class="small strong" text-anchor="start" data-bounds="36 64 288 98"><tspan x="40" y="85">Storage endpoint</tspan></text>
  <text class="small strong" text-anchor="start" data-bounds="305 64 683 98"><tspan x="309" y="85">Data-API access in the example</tspan></text>
  <path d="M297 62L297 244" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M28 100L692 100" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="strong" text-anchor="start" data-bounds="36 102 288 160"><tspan x="40" y="123">Mainland Alibaba Cloud OSS</tspan></text>
  <text text-anchor="start" data-bounds="305 102 683 160"><tspan x="309" y="123">ICP-filed CNAME required</tspan><tspan x="309" y="144">OSS activation from 2025-03-20</tspan></text>
  <path d="M28 162L692 162" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text text-anchor="start" data-bounds="36 164 288 201"><tspan x="40" y="185">Hong Kong OSS</tspan></text>
  <text text-anchor="start" data-bounds="305 164 683 201"><tspan x="309" y="185">Outside that mainland rule</tspan></text>
  <path d="M28 203L692 203" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text text-anchor="start" data-bounds="36 205 288 242"><tspan x="40" y="226">Mainland Tencent COS</tspan></text>
  <text text-anchor="start" data-bounds="305 205 683 242"><tspan x="309" y="226">Default domain served API downloads</tspan></text>
  <path d="M28 244L692 244" fill="none" stroke="#C5CDD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
