<svg xmlns="http://www.w3.org/2000/svg" width="720" height="284" viewBox="0 0 720 284" role="img" xml:lang="en">
  <title>The age recipient encrypts x to x.age, and only the corresponding key.txt identity decrypts it.</title>
  <rect width="720" height="284" fill="#FFFFFF"/>
  <style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#202832;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.title{font-size:18px;font-weight:700}
.label{font-size:15px;font-weight:650}
.small{font-size:13px}
.strong{font-weight:650}
.muted{fill:#52616F}
.focus{fill:#2159A6}
.fail{fill:#A13834}
.pass{fill:#246849}
  </style>
  <defs>
    <marker id="arrow-focus" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#2159A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8.5" refY="5" orient="auto"><path d="M2.5 1.5L8.5 5 2.5 8.5" fill="none" stroke="#52616F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <text class="title" text-anchor="start" data-bounds="27 15 693 52"><tspan x="28" y="38">age keys and ciphertext</tspan></text>
  <text class="label" text-anchor="start" data-bounds="22 53 698 272"><tspan x="28" y="86">Public recipient</tspan></text>
  <text class="mono focus strong" text-anchor="start" data-bounds="22 53 698 272"><tspan x="28" y="112">age1…</tspan></text>
  <text class="label" text-anchor="start" data-bounds="22 53 698 272"><tspan x="566" y="86">Private identity</tspan></text>
  <text class="mono focus strong" text-anchor="start" data-bounds="22 53 698 272"><tspan x="566" y="112">key.txt</tspan></text>
  <path d="M89 118V140H234V159" fill="none" stroke="#2159A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-focus)"/>
  <path d="M610 118V140H480V159" fill="none" stroke="#2159A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-focus)"/>
  <rect x="304" y="154" width="111" height="41" rx="3" fill="#EDF2F6" stroke="#2159A6" stroke-width="1"/>
  <text class="mono focus strong" text-anchor="middle" data-bounds="312 155 406 193"><tspan x="359" y="180">x.age</tspan></text>
  <text class="mono strong" text-anchor="start" data-bounds="22 53 698 272"><tspan x="51" y="181">x</tspan></text>
  <path d="M76 173L295 173" fill="none" stroke="#52616F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <path d="M415 173L635 173" fill="none" stroke="#52616F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <text class="mono strong" text-anchor="start" data-bounds="22 53 698 272"><tspan x="653" y="180">x</tspan></text>
  <text class="small" text-anchor="middle" data-bounds="22 53 698 272"><tspan x="191" y="206">Encrypt</tspan></text>
  <text class="small" text-anchor="middle" data-bounds="22 53 698 272"><tspan x="518" y="206">Decrypt</tspan></text>
  <text class="small muted" text-anchor="middle" data-bounds="22 53 698 272"><tspan x="359" y="241">Ciphertext may go in Git</tspan></text>
</svg>
